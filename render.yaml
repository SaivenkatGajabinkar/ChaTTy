databases:
  - name: chatty-db
    databaseName: chatty_db
    user: chatty_user
    plan: free

services:
  - type: web
    name: chatty-backend
    runtime: docker
    plan: free
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatty-db
          property: connectionString
      - key: CORS_ORIGIN
        value: '*'
